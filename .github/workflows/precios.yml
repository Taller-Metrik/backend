name: Precios de materiales

# Actualiza el catálogo de precios (RF-23) una vez al día desde la tienda.
# Necesita el secreto DATABASE_URL del repositorio (la misma base de datos del API).
on:
  schedule:
    - cron: "0 11 * * *"  # 06:00 hora de Lima
  workflow_dispatch:

concurrency:
  group: precios  # nunca dos actualizaciones a la vez
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actualizar:
    name: Actualizar precios
    runs-on: ubuntu-latest
    if: github.repository == 'Taller-Metrik/backend'  # en forks no hay secreto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-scraper.txt

      - name: Actualizar el catálogo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: clave-solo-para-el-job-de-precios-de-32-caracteres
        run: python -m scripts.actualizar_precios
