name: CD (Google Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-produccion
  cancel-in-progress: false

env:
  # Opcionales: si no se definen como variables del repositorio se usan estos valores
  REGION: ${{ vars.GCP_REGION || 'southamerica-west1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'metrik-api' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'metrik' }}
  # Nombres de los secretos de la app en Google Secret Manager
  SECRETS: DATABASE_URL=metrik-database-url:latest,SECRET_KEY=metrik-secret-key:latest

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar la llave JSON (secreto GCP_CREDENTIALS)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -z "$GCP_CREDENTIALS" ]; then
            echo "::error::Falta el secreto GCP_CREDENTIALS. Pegue el JSON completo de la cuenta de servicio en Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          if ! echo "$GCP_CREDENTIALS" | jq -e '.type == "service_account" and .project_id and .client_email and .private_key' > /dev/null; then
            echo "::error::GCP_CREDENTIALS no es una llave JSON de cuenta de servicio válida. Pegue el archivo .json descargado, completo y sin editar (sin comentarios). Si el error menciona 'control characters', la private_key se partió en varias líneas al copiarla: debe quedar en una sola línea con los saltos escritos como \\n."
            exit 1
          fi

      - name: Autenticación en Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Datos del proyecto (desde el JSON)
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          SA_EMAIL=$(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")
          RUNTIME_SA="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          RUNTIME_SA="${RUNTIME_SA:-$SA_EMAIL}"
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "RUNTIME_SA=$RUNTIME_SA"
            echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${{ github.sha }}"
          } >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_ID · Región: $REGION · Servicio: $SERVICE · Cuenta: $RUNTIME_SA"

      - name: Sincronizar secretos de GitHub con Secret Manager
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          # Quita espacios y saltos de línea que se cuelan al pegar el valor en GitHub
          trim() { local v="${1//$'\r'/}"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }

          # Crea el secreto o agrega una versión nueva solo si el valor cambió
          upsert() {
            local name="$1" value="$2"
            if ! gcloud secrets describe "$name" --project "$PROJECT_ID" > /dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets create "$name" --project "$PROJECT_ID" \
                --replication-policy automatic --data-file=- > /dev/null
              echo "Secreto '$name' creado"
            elif [ "$(gcloud secrets versions access latest --secret "$name" --project "$PROJECT_ID")" != "$value" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project "$PROJECT_ID" --data-file=- > /dev/null
              echo "Secreto '$name' actualizado"
            else
              echo "Secreto '$name' sin cambios"
            fi
          }

          DB_URL=$(trim "$DATABASE_URL")
          if [ -z "$DB_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL en GitHub (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi
          upsert metrik-database-url "$DB_URL"

          KEY=$(trim "$SECRET_KEY")
          if [ -n "$KEY" ]; then
            if [ ${#KEY} -lt 32 ]; then
              echo "::error::El secreto SECRET_KEY debe tener al menos 32 caracteres."
              exit 1
            fi
            upsert metrik-secret-key "$KEY"
          elif gcloud secrets describe metrik-secret-key --project "$PROJECT_ID" > /dev/null 2>&1; then
            echo "Secreto 'metrik-secret-key' existente (se reutiliza)"
          else
            KEY=$(openssl rand -base64 48 | tr -d '\n')
            echo "::add-mask::$KEY"
            upsert metrik-secret-key "$KEY"
            echo "SECRET_KEY generada automáticamente (se reutilizará en los siguientes despliegues)"
          fi

      - name: Construir y subir imagen a Artifact Registry
        run: |
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --project "$PROJECT_ID" --location "$REGION" > /dev/null 2>&1 \
            || gcloud artifacts repositories create "$GAR_REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --repository-format docker
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Migraciones (Cloud Run Job)
        run: |
          gcloud run jobs deploy "$SERVICE-migraciones" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "$SECRETS" \
            --command alembic --args upgrade,head \
            --max-retries 0 --task-timeout 10m \
            --execute-now --wait

      - name: Desplegar servicio
        id: deploy
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || '["*"]' }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || '1440' }}
        run: |
          cat > env.yaml <<EOF
          DEBUG: "false"
          ACCESS_TOKEN_EXPIRE_MINUTES: "$ACCESS_TOKEN_EXPIRE_MINUTES"
          ALLOWED_ORIGINS: '$ALLOWED_ORIGINS'
          EOF
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "$SECRETS" \
            --env-vars-file env.yaml \
            --port 8080 --cpu 1 --memory 1Gi \
            --min-instances 0 --max-instances 3 \
            --allow-unauthenticated \
            --quiet
          echo "url=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Prueba de humo
        run: curl -fsS --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/health"
