name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metrik
          POSTGRES_PASSWORD: metrik
          POSTGRES_DB: metrik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metrik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credenciales desechables del PostgreSQL efímero del runner (no son secretos)
      DATABASE_URL: postgresql+asyncpg://metrik:metrik@localhost:5432/metrik_test
      SECRET_KEY: clave-solo-para-ci-de-al-menos-32-caracteres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then export TEST_DATABASE_URL="$DATABASE_URL"; fi
          pytest --cov --cov-report=term-missing

      - name: Migraciones Alembic sobre base limpia
        if: matrix.db == 'postgres'
        run: |
          psql "postgresql://metrik:metrik@localhost:5432/postgres" -c "CREATE DATABASE metrik_migraciones;"
          DATABASE_URL=postgresql+asyncpg://metrik:metrik@localhost:5432/metrik_migraciones alembic upgrade head

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metrik
          POSTGRES_PASSWORD: metrik
          POSTGRES_DB: metrik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metrik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t metrik-api:ci .

      - name: Prueba de humo (/health y /api/v1/ml/info)
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+asyncpg://metrik:metrik@localhost:5432/metrik \
            -e SECRET_KEY=clave-solo-para-ci-de-al-menos-32-caracteres \
            metrik-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/api/v1/ml/info > /dev/null
          echo "OK"

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true
